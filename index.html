<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Security Headers -->
    <!-- CSP funciona via <meta>. script-src usa o hash do script inline logo acima (SPA redirect do
         GitHub Pages) em vez de 'unsafe-inline' — assim nenhum outro script injetado consegue rodar,
         só esse. connect-src já libera formspree/emailjs pro fetch() do formulário de contato. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-nLAnh9qIyHANLV3Ff8BpGL65BkZhBwF1s4ktxQIy82Y='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com; connect-src 'self' https://formspree.io https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io https://api.emailjs.com;" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- X-Content-Type-Options, X-Frame-Options e Permissions-Policy foram REMOVIDOS daqui de
         propósito: nenhum navegador aplica esses 3 headers quando estão em <meta> (só funcionam como
         header HTTP de verdade). Mantê-los só dava falsa sensação de proteção. O GitHub Pages não
         deixa configurar headers HTTP — pra ter esses 3 valendo de verdade, usar domínio próprio
         com Cloudflare na frente (Response Header Transform Rule). -->
    <title>Escola Kairala José Kairala — Ensino Médio Integral</title>
    <meta name="description" content="Portal oficial da Escola Kairala José Kairala — Ensino Médio em Tempo Integral, do 1º ao 3º ano, das 7h às 15h." />
    <meta property="og:title" content="Escola Kairala José Kairala" />
    <meta property="og:description" content="Ensino Médio em TempoEncial. Conhecimento, projetos, clubes e tutorias." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
